esphome:
  name: wisafe2-bridge
  friendly_name: WiSafe2 Bridge
  project:
    name: nickkennedy.wisafe2_bridge
    version: "0.2.0"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
    key: !secret api_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  discover_ip: false
  log_topic:

ota:

  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WiSafe2 Bridge Fallback"
    password: !secret fallback_password

captive_portal:

wisafe2:
  id: wisafe_radio
  sclk_pin: 5
  mosi_pin: 6
  miso_pin: 7
  cs_pin: 8
  irq_pin: 38
  max_detectors: 16
  bridge_device_id: "A5B813"
  initialized:
    name: "Radio Initialized"
  last_packet:
    name: "Last Packet"
  last_device:
    name: "Last Device"
  last_model:
    name: "Last Model"
  last_event:
    name: "Last Event"
  last_result:
    name: "Last Result"
  last_base:
    name: "Last Base State"
  last_battery:
    name: "Last Battery State"
