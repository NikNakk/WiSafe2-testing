esphome:
  name: wisafe2-bridge
  friendly_name: WiSafe2 Bridge
  project:
    name: nickkennedy.wisafe2_bridge
    version: "0.1.0"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WiSafe2 Bridge Fallback"
    password: !secret fallback_password

captive_portal:

wisafe2:
  id: wisafe_radio
  sclk_pin: 5
  mosi_pin: 6
  miso_pin: 7
  cs_pin: 8
  irq_pin: 38
  initialized:
    name: "Radio Initialized"
  last_packet:
    name: "Last Packet"

